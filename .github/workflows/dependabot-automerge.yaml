name: Dependabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * MON-FRI"

env:
  TZ: Europe/Oslo

jobs:
  dependabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    name: Dependabot Auto-merge
    uses: navikt/mob-gha-workflows/.github/workflows/dependabot-automerge.yaml@eeb9163c47db1ceaadebd3130fa5f03c0fbf0b45 # ratchet:navikt/mob-gha-workflows/.github/workflows/dependabot-automerge.yaml@v1.2.1
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}