name: Dependabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * MON-FRI"

env:
  TZ: Europe/Oslo

jobs:
  dependabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    name: Dependabot Auto-merge
    uses: navikt/mob-gha-workflows/.github/workflows/dependabot-automerge.yaml@6d597f4b49bff3f5e59833b784eb63aa5ddc8603 # ratchet:navikt/mob-gha-workflows/.github/workflows/dependabot-automerge.yaml@v1.0.2
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}